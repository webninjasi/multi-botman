[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botman"
version = "0.1.0"
description = "Discord-managed Compose application deployment and logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncssh>=2.14,<3",
  "discord.py>=2.3,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
botman = "botman.bot:main"
botman-log-agent = "botman_agent.main:main"
botman-log-export = "botman_agent.export:main"
botman-target-preflight = "botman_agent.preflight:main"

[project.optional-dependencies]
agent = [
  "aiohttp>=3.9,<4",
  "cysystemd>=2,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "mypy>=1.11,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["botman*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
